<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه آنلاین</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            background:#f5f5f5;
            font-family:Tahoma, sans-serif;
        }

        .enter-btn{
            padding:15px 40px;
            border:none;
            border-radius:10px;
            background:#222;
            color:#fff;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        .enter-btn:hover{
            background:#444;
        }

        .footer{
            position:absolute;
            bottom:20px;
            color:#666;
            font-size:14px;
        }
    </style>
</head>
<body>

    <button class="enter-btn">
        ورود به فروشگاه
    </button>

    <div class="footer">
        Created by Nezam
    </div>

</body>
</html>
